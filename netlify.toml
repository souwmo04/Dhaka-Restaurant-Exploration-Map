# Netlify picks up Next.js automatically (OpenNext adapter); this file only
# pins the runtime and caches static assets. Security headers live in
# next.config.ts, because Netlify's [[headers]] don't reach pages Next.js serves.

[build.environment]
  NODE_VERSION = "22"

# The MapLibre worker is copied in at install time with its version in the name.
[[headers]]
  for = "/maplibre/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

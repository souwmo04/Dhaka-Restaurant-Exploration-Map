# Netlify picks up Next.js automatically (OpenNext adapter); this file only
# pins the runtime and adds headers.

[build.environment]
  NODE_VERSION = "22"

# Basic hardening for every page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The MapLibre worker is copied in at install time with its version in the name.
[[headers]]
  for = "/maplibre/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
